name: Apply visual review refinements

on:
  push:
    branches: [polish/visual-system-coherence]
    paths:
      - scripts/apply_visual_review_fixes.py
      - .github/workflows/apply-visual-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/visual-system-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install template validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply screenshot review refinements
        run: python scripts/apply_visual_review_fixes.py
      - name: Remove one-shot files
        run: rm scripts/apply_visual_review_fixes.py .github/workflows/apply-visual-review-fixes.yml
      - name: Validate, type-check, lint, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "polish: finish the visual-system pass"
          git push origin HEAD:polish/visual-system-coherence
