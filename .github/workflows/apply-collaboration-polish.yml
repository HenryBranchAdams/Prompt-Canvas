name: Apply collaboration polish

on:
  push:
    branches: [polish/codex-collaboration-ux]
    paths:
      - scripts/apply_collaboration_polish.py
      - scripts/fix_collaboration_applicator.py
      - scripts/fix_collaboration_test.py
      - .github/workflows/apply-collaboration-polish.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    # This one-shot job replaces itself with the verified source changes.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/codex-collaboration-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install template validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Correct and apply collaboration UX patch
        run: |
          python scripts/fix_collaboration_applicator.py
          python scripts/fix_collaboration_test.py
          python scripts/apply_collaboration_polish.py
      - name: Remove one-shot applicator
        run: rm scripts/apply_collaboration_polish.py scripts/fix_collaboration_applicator.py scripts/fix_collaboration_test.py .github/workflows/apply-collaboration-polish.yml
      - name: Validate, type-check, lint, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: clarify human and Codex collaboration"
          git push origin HEAD:polish/codex-collaboration-ux
