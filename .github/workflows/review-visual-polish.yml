name: Review visual polish

on:
  push:
    branches: [polish/codex-collaboration-ux]
    paths:
      - .github/workflows/review-visual-polish.yml

permissions:
  contents: write

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

concurrency:
  group: review-visual-polish
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/codex-collaboration-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Prompt Canvas
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/prompt-canvas-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prompt-canvas-vite.log
          exit 1
      - name: Capture review surfaces
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test'
          import { mkdir, writeFile } from 'node:fs/promises'

          const output = 'qa-artifacts/visual-polish-review'
          await mkdir(output, { recursive: true })
          const browser = await chromium.launch()
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } })
          await context.addInitScript(() => {
            Object.defineProperty(document, 'modelContext', {
              configurable: true,
              value: { registerTool() { return Promise.resolve() } },
            })
          })
          const page = await context.newPage()
          const consoleIssues = []
          page.on('console', (message) => {
            if (message.type() === 'error' || message.type() === 'warning') {
              consoleIssues.push(`${message.type()}: ${message.text()}`)
            }
          })
          page.on('pageerror', (error) => consoleIssues.push(`pageerror: ${error.message}`))

          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await page.locator('.pc-loading').waitFor({ state: 'hidden', timeout: 30_000 })
          await page.screenshot({ path: `${output}/01-gallery-1440.png` })

          await page.getByRole('button', { name: 'Start' }).first().click()
          await page.locator('.pc-panel--output').waitFor({ state: 'visible', timeout: 30_000 })
          await page.screenshot({ path: `${output}/02-workbench-1440.png` })

          await page.getByRole('button', { name: 'Help me shape it' }).click()
          await page.getByRole('heading', { name: 'Ask Codex to help with the brief' }).waitFor()
          await page.setViewportSize({ width: 1280, height: 900 })
          await page.screenshot({ path: `${output}/03-shape-dialog-1280.png` })
          await page.getByRole('button', { name: 'Done' }).click()

          await page.locator('.pc-topbar').getByRole('button', { name: 'Ask Codex to generate' }).click()
          await page.getByRole('heading', { name: 'Ask Codex to create this image' }).waitFor()
          await page.screenshot({ path: `${output}/04-generate-dialog-1280.png` })
          await page.getByRole('button', { name: 'Done' }).click()

          await page.setViewportSize({ width: 900, height: 800 })
          await page.screenshot({ path: `${output}/05-workbench-900.png` })
          await page.setViewportSize({ width: 760, height: 800 })
          await page.screenshot({ path: `${output}/06-workbench-760.png` })
          await page.setViewportSize({ width: 640, height: 800 })
          await page.screenshot({ path: `${output}/07-workbench-640.png` })

          await writeFile(`${output}/console.txt`, consoleIssues.join('\n') || 'No console warnings or errors captured.\n')
          await browser.close()
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: visual-polish-review-${{ github.sha }}
          path: qa-artifacts/visual-polish-review/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary review workflow
        run: rm .github/workflows/review-visual-polish.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary visual polish review"
          for attempt in 1 2 3; do
            git fetch origin polish/codex-collaboration-ux
            if git rebase origin/polish/codex-collaboration-ux && git push origin HEAD:polish/codex-collaboration-ux; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
