name: Finalize collaboration polish

on:
  push:
    branches: [polish/codex-collaboration-ux]
    paths:
      - scripts/finalize_collaboration_polish.py
      - scripts/fix_finalize_collaboration_test.py
      - .github/workflows/finalize-collaboration-polish.yml

permissions:
  contents: write

concurrency:
  group: finalize-collaboration-polish
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/codex-collaboration-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install template validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply final collaboration polish
        run: python scripts/finalize_collaboration_polish.py
      - name: Remove one-shot files
        run: rm -f scripts/finalize_collaboration_polish.py scripts/fix_finalize_collaboration_test.py .github/workflows/finalize-collaboration-polish.yml
      - name: Validate, type-check, lint, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Commit and push verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "polish: refine collaboration handoff preview"
          for attempt in 1 2 3; do
            git fetch origin polish/codex-collaboration-ux
            if git rebase origin/polish/codex-collaboration-ux && git push origin HEAD:polish/codex-collaboration-ux; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
