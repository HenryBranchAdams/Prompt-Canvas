name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install template validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate, type-check, lint, and build
        run: npm run check
      - name: Verify generated sources are committed
        run: git diff --exit-code -- src/generated
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
