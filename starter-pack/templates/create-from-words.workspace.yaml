schema: prompt-canvas.prompt-workspace-template@2
id: create-from-words
version: 2
title: Create an image from words
description: Describe an idea, choose a few essentials, and create one polished image.
category: start-fast
tags: [quick start, text to image, describe an image, make a picture]
status: starter
compatibility:
  minimumAppVersion: 0.1.0
  templateFamily: lightweight
thumbnail:
  assetPath: /recipe-thumbnails/create-from-words.webp
  alt: A small observatory glowing beneath a vivid desert night sky.
  accent: '#5B5CE2'
capabilities: [text-to-image, image-edit, variations, upscale]
generation:
  provider: codex
  capability: image-generation
  delivery: webmcp-import
  operations: [generate, edit, variation, upscale]
  defaultOperation: generate
  defaultVariationCount: 4
  preferredMimeTypes: [image/png, image/webp]
prompt:
  title: Full creative direction
  body: >-
    Create a polished image of {{brief}}. Follow the selected visual direction,
    composition, and aspect ratio. Build a clear focal point, coherent lighting,
    believable materials, and enough detail for the idea to feel intentional.
    Do not add logos, watermarks, unsupported factual claims, or unrelated text.
  variables:
    - id: brief
      label: What would you like to see?
      type: text
      required: true
      defaultValue: A quiet observatory beneath a vivid desert night sky
controls:
  - id: brief
    label: Describe your image
    type: textarea
    required: true
    defaultValue: A quiet observatory beneath a vivid desert night sky
    binding: { mode: variable, target: brief }
    ui: { width: full, placeholder: 'Describe the subject, setting, and mood' }
  - id: visual-direction
    label: Visual direction
    type: chips
    defaultValue: cinematic
    options:
      - { label: Photorealistic, value: photorealistic }
      - { label: Cinematic, value: cinematic }
      - { label: Illustration, value: illustration }
      - { label: Minimal, value: minimal }
    binding: { mode: agent-context, target: visual.direction }
  - id: composition
    label: Composition
    type: composition
    defaultValue: wide-shot
    options:
      - { label: Wide shot, value: wide-shot }
      - { label: Close-up, value: close-up }
      - { label: Centered, value: centered }
      - { label: Off-center, value: off-center }
    binding: { mode: agent-context, target: visual.composition }
  - id: aspect-ratio
    label: Aspect ratio
    type: aspect-ratio
    defaultValue: '3:2'
    options:
      - { label: Square 1:1, value: '1:1' }
      - { label: Landscape 3:2, value: '3:2' }
      - { label: Portrait 2:3, value: '2:3' }
    binding: { mode: generation, target: aspectRatio }
outputs:
  - id: primary
    label: Your result
    role: primary
    kind: image
    count: 1
    aspectRatio: '3:2'
    operations: [generate, edit, upscale]
    layoutHint: hero
  - id: variations
    label: Variations
    role: variation
    kind: image-set
    count: 4
    aspectRatio: '3:2'
    operations: [variation]
    layoutHint: strip
blocks:
  - id: your-input
    type: controls
    title: 1. Your input
    x-controlIds: [brief]
    x-connectTo: primary-output
    x-geometry: { x: 80, y: 150, w: 360, h: 280 }
  - id: visual-direction
    type: controls
    title: 2. Essential choices
    x-controlIds: [visual-direction, composition, aspect-ratio]
    x-connectTo: primary-output
    x-geometry: { x: 500, y: 120, w: 360, h: 420 }
  - id: primary-output
    type: output
    title: 3. Your result
    sourceId: primary
    x-connectTo: variation-strip
    x-geometry: { x: 930, y: 120, w: 620, h: 600 }
  - id: variation-strip
    type: variations
    title: Variations
    sourceId: variations
    x-geometry: { x: 930, y: 760, w: 620, h: 280 }
layout:
  mode: seeded
  arrangement: prompt-left-output-right
  preserveManualGeometry: true
source:
  kind: first-party
  title: Create an image from words
  creator: Prompt Canvas
  promptUsage: original
x-discovery:
  collection: start-fast
  userPromise: Describe anything and get a polished first image.
  intentAliases: [make a picture, create art, draw this, generate an image]
  intents: [create]
  inputModes: [text]
  subjectKinds: [person, pet, product, object, place, concept]
  outputKinds: [image]
  preservationNeeds: []
  complexity: quick
  requiredInputSummary: [A short description]
  inputSummary: [A short description]
  badges: [No photo needed, Makes 1 image]
  thumbnail:
    src: /recipe-thumbnails/create-from-words.webp
    alt: A luminous glass pavilion generated from a short written description
  featuredRank: 1
x-presentation:
  primaryControlIds: [brief, visual-direction, composition, aspect-ratio]
  advancedControlIds: []
  initialView: canvas
  resultEmphasis: hero
  showPromptByDefault: false
