schema: prompt-canvas.prompt-workspace-template@2
id: expand-reframe
version: 1
title: Expand or reframe an image
description: Adapt an image to a new shape without awkward cropping.
category: start-fast
tags: [make wider, outpaint, crop, reframe, extend image]
status: starter
compatibility: { minimumAppVersion: 0.1.0, templateFamily: reference-transformation }
thumbnail:
  assetPath: /recipe-thumbnails/expand-reframe.webp
  alt: A lighthouse photograph expanding from a portrait crop into a wide coast.
  accent: '#4A90A4'
capabilities: [image-to-image, image-edit, upscale]
generation:
  provider: codex
  capability: image-generation
  delivery: webmcp-import
  operations: [edit, upscale]
  defaultOperation: edit
  preferredMimeTypes: [image/png, image/webp]
prompt:
  title: Expand or reframe
  body: >-
    Adapt the supplied image to {{target_ratio}} using the selected framing
    method. Protect the important subject region, horizon, perspective, scale,
    and lighting. When extending, continue plausible scene geometry and texture.
    When cropping, keep the focal subject complete and the composition balanced.
  variables:
    - id: target_ratio
      label: Target aspect ratio
      type: enum
      required: true
      defaultValue: '16:9'
      values: ['1:1', '4:5', '3:2', '16:9']
references:
  - id: source-photo
    label: Source image
    role: source-photo
    required: true
    multiple: false
    acceptedMimeTypes: [image/jpeg, image/png, image/webp]
    preserve: [important subject region, perspective, scale, lighting]
controls:
  - id: target-ratio
    label: Target format
    type: aspect-ratio
    required: true
    defaultValue: '16:9'
    options:
      - { label: Square 1:1, value: '1:1' }
      - { label: Portrait 4:5, value: '4:5' }
      - { label: Landscape 3:2, value: '3:2' }
      - { label: Wide 16:9, value: '16:9' }
    binding: { mode: variable, target: target_ratio }
  - id: framing-method
    label: Framing method
    type: chips
    defaultValue: extend
    options:
      - { label: Extend scene, value: extend }
      - { label: Crop carefully, value: crop }
      - { label: Let Codex decide, value: auto }
    binding: { mode: agent-context, target: edit.framingMethod }
  - id: subject-placement
    label: Subject placement
    type: composition
    defaultValue: preserve
    options:
      - { label: Preserve position, value: preserve }
      - { label: Center, value: center }
      - { label: Rule of thirds, value: thirds }
    binding: { mode: agent-context, target: edit.subjectPlacement }
preservation:
  - id: protected-region
    description: Preserve the important subject region, perspective, scale, and lighting.
    strength: must
outputs:
  - { id: primary, label: Reframed image, role: primary, kind: image, count: 1, operations: [edit, upscale], layoutHint: hero }
blocks:
  - { id: source, type: references, title: '1. Your image', x-connectTo: primary-output, x-geometry: { x: 80, y: 130, w: 380, h: 310 } }
  - { id: format, type: controls, title: '2. New format', x-controlIds: [target-ratio], x-connectTo: primary-output, x-geometry: { x: 510, y: 130, w: 360, h: 190 } }
  - { id: framing, type: controls, title: Framing method, x-controlIds: [framing-method], x-connectTo: primary-output, x-geometry: { x: 510, y: 360, w: 360, h: 180 } }
  - { id: placement, type: controls, title: Subject placement, x-controlIds: [subject-placement], x-connectTo: primary-output, x-geometry: { x: 510, y: 580, w: 360, h: 180 } }
  - { id: primary-output, type: output, title: '3. Your result', sourceId: primary, x-geometry: { x: 930, y: 120, w: 620, h: 600 } }
  - { id: full-prompt, type: prompt, title: 'More control · Preservation and prompt', x-connectTo: primary-output, x-geometry: { x: 80, y: 500, w: 380, h: 350 } }
layout: { mode: seeded, arrangement: reference-transform, preserveManualGeometry: true }
source: { kind: first-party, title: Expand or reframe an image, creator: Prompt Canvas, promptUsage: original }
x-discovery:
  collection: start-fast
  userPromise: Make an image wider, taller, or differently framed.
  intentAliases: [make this wider, outpaint this, crop for social, change aspect ratio]
  inputSummary: [1 source image, A target format]
  badges: [Needs 1 image, Protects subject]
  featuredRank: 5
x-presentation: { primaryControlIds: [target-ratio, framing-method, subject-placement], initialView: canvas, resultEmphasis: hero, showPromptByDefault: false }
