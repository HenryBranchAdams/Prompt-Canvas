schema: prompt-canvas.prompt-workspace-template@2
id: landmark-shape-remix
version: 1
title: Landmark shape remix
description: Translate a source landmark into bold geometric color while preserving its recognition cues.
category: photo-transformation
tags:
- photo transformation
- landmark color blocks
- geometric city remix
status: starter
compatibility:
  minimumAppVersion: 0.1.0
  templateFamily: reference-transformation
source:
  kind: first-party
  creator: Prompt Canvas
  title: Landmark shape remix
  promptUsage: original
  notes: Independently authored for Prompt Canvas from a high-level creative use case.
thumbnail:
  assetPath: /recipe-thumbnails/original-systems/landmark-shape-remix.svg
  alt: First-party graphic preview for Landmark shape remix, illustrating recognizable shape abstraction.
capabilities:
- image-to-image
- image-edit
- variations
- upscale
generation:
  provider: codex
  capability: image-generation
  delivery: webmcp-import
  operations: &id001
  - edit
  - variation
  - upscale
  defaultOperation: edit
  defaultVariationCount: 1
  preferredMimeTypes:
  - image/png
  - image/webp
prompt:
  title: Creative direction
  body: Translate a source landmark into bold geometric color while preserving its recognition cues. Using the source image
    as factual ground truth, create an original transformation for {{brief}}. Use {{method}} as the visual method. Organize
    the image so {{structure}}. Favor one clear focal idea, intentional negative space, coherent lighting, believable depth,
    and material-specific detail. Do not add unrelated text, logos, watermarks, copied characters, or unsupported factual
    claims.
  variables:
  - id: brief
    label: Creative brief
    type: text
    required: true
    defaultValue: Turn this landmark photo into a layered geometric print
  - id: method
    label: Visual method
    type: string
    defaultValue: recognizable shape abstraction
  - id: structure
    label: Composition rule
    type: string
    defaultValue: silhouette, viewpoint, and defining structures remain readable
  agentInstructions: Resolve all visible controls and reference obligations before generation. Produce one candidate by default
    and return it to the primary output slot.
controlGroups:
- id: required
  label: Required
  description: The idea or source needed to begin.
- id: essentials
  label: Essentials
  description: A few choices that shape the result.
- id: more-control
  label: More control
  collapsedByDefault: true
controls:
- id: brief
  label: What should the image show?
  type: textarea
  required: true
  defaultValue: Turn this landmark photo into a layered geometric print
  binding:
    mode: variable
    target: brief
- id: method
  label: Visual method
  type: text
  defaultValue: recognizable shape abstraction
  binding:
    mode: variable
    target: method
- id: structure
  label: Composition rule
  type: textarea
  defaultValue: silhouette, viewpoint, and defining structures remain readable
  binding:
    mode: variable
    target: structure
- id: aspect-ratio
  label: Format
  type: aspect-ratio
  defaultValue: '4:5'
  options:
  - label: Portrait 4:5
    value: '4:5'
  - label: Tall 9:16
    value: '9:16'
  - label: Square 1:1
    value: '1:1'
  - label: Landscape 3:2
    value: '3:2'
  binding:
    mode: generation
    target: aspectRatio
outputs:
- id: primary
  label: Result
  role: primary
  kind: image
  count: 1
  aspectRatio: '4:5'
  operations: *id001
  layoutHint: hero
  required: true
blocks:
- id: source-photo
  type: references
  title: 1. Source photo
  sourceId: source-image
  x-connectTo: primary-output
  x-geometry:
    x: 80
    y: 80
    w: 360
    h: 220
- id: creative-brief
  type: controls
  title: 2. Creative direction
  content:
    controlIds:
    - brief
  x-connectTo: primary-output
  x-geometry:
    x: 80
    y: 340
    w: 360
    h: 220
- id: visual-method
  type: controls
  title: 3. Visual method
  content:
    controlIds:
    - method
  x-connectTo: primary-output
  x-geometry:
    x: 500
    y: 90
    w: 350
    h: 170
- id: composition-rule
  type: controls
  title: Composition rule
  content:
    controlIds:
    - structure
  x-connectTo: primary-output
  x-geometry:
    x: 500
    y: 300
    w: 350
    h: 210
- id: format
  type: controls
  title: 4. Format
  content:
    controlIds:
    - aspect-ratio
  x-connectTo: primary-output
  x-geometry:
    x: 500
    y: 550
    w: 350
    h: 170
- id: primary-output
  type: output
  title: 5. Result
  sourceId: primary
  x-geometry:
    x: 930
    y: 100
    w: 620
    h: 620
- id: full-prompt
  type: prompt
  title: More control · Full prompt
  collapsedByDefault: true
  x-connectTo: primary-output
  x-geometry:
    x: 80
    y: 610
    w: 360
    h: 330
layout:
  mode: seeded
  arrangement: prompt-left-output-right
  preserveManualGeometry: true
x-discovery:
  collection: original-systems
  userPromise: Translate a source landmark into bold geometric color while preserving its recognition cues.
  intentAliases:
  - landmark color blocks
  - geometric city remix
  - simplify architecture photo
  intents:
  - edit
  inputModes:
  - single-image
  subjectKinds:
  - person
  - object
  - place
  - concept
  outputKinds:
  - image
  preservationNeeds:
  - identity
  - composition
  complexity: guided
  requiredInputSummary:
  - One source image and a short direction
  inputSummary:
  - One photo and a creative direction
  badges:
  - Needs 1 photo
  - Keeps source identity
  - Makes 1 image
  thumbnail:
    src: /recipe-thumbnails/original-systems/landmark-shape-remix.svg
    alt: First-party graphic preview for Landmark shape remix, illustrating recognizable shape abstraction.
x-presentation:
  primaryControlIds:
  - brief
  - method
  - structure
  - aspect-ratio
  advancedControlIds: []
  initialView: canvas
  resultEmphasis: hero
  showPromptByDefault: false
x-agent-authoring:
  origin: independent-first-party
  reviewState: owner-requested-original-authoring
  generationDefault: 1
references:
- id: source-image
  label: Source image
  role: source-photo
  description: The photo to transform.
  required: true
  acceptedMimeTypes:
  - image/jpeg
  - image/png
  - image/webp
  preserve:
  - identity and defining features
  - original composition unless the brief changes it
  instructions: Use this image as the factual source. Do not invent changes outside the stated brief.
preservation:
- id: creative-mechanism
  label: Creative mechanism
  description: 'Preserve the defining recognizable shape abstraction method and this composition obligation: silhouette, viewpoint,
    and defining structures remain readable.'
  strength: must
  appliesTo:
  - method
  - structure
- id: source-truth
  label: Source truth
  description: silhouette, viewpoint, and defining structures remain readable
  strength: must
  appliesTo:
  - source-image
