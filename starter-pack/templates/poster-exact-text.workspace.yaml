schema: prompt-canvas.prompt-workspace-template@2
id: poster-exact-text
version: 1
title: Poster with exact text
description: Create a polished poster while preserving the supplied headline exactly.
category: posters-and-content
tags: [poster, exact text, typography, graphic design]
status: starter
compatibility: { minimumAppVersion: 0.1.0, templateFamily: parameterized }
source: { kind: first-party, creator: Prompt Canvas, title: Poster with exact text, promptUsage: original }
thumbnail:
  assetPath: /recipe-thumbnails/poster-exact-text.webp
  alt: A framed geometric concert poster displayed on a warm gallery wall
capabilities: [text-to-image, typography, structured-prompt, variations, image-edit, upscale]
generation:
  provider: codex
  capability: image-generation
  delivery: webmcp-import
  operations: [generate, edit, variation, upscale]
  defaultOperation: generate
prompt:
  title: Poster direction
  body: >-
    Design an original {{poster_type}} poster for {{subject}}. Render the headline exactly as supplied:
    “{{exact_title}}”. Use {{visual_direction}} with a clear hierarchy, confident negative space, and a legible
    title area. Do not invent additional names, dates, sponsors, logos, or fine print.
  variables:
  - { id: exact_title, label: Exact title, type: string, required: true, defaultValue: Summer Night Tournament }
  - { id: subject, label: Subject, type: text, required: true, defaultValue: An evening community sports tournament }
  - { id: poster_type, label: Poster type, type: enum, defaultValue: event, values: [event, cultural, editorial, promotional] }
  - { id: visual_direction, label: Visual direction, type: enum, defaultValue: bold geometric, values: [bold geometric, refined editorial, playful collage, cinematic] }
controls:
- { id: exact-title, label: Exact title, type: text, required: true, defaultValue: Summer Night Tournament, binding: { mode: variable, target: exact_title } }
- { id: subject, label: "What is it for?", type: textarea, required: true, defaultValue: An evening community sports tournament, binding: { mode: variable, target: subject } }
- { id: poster-type, label: Poster type, type: enum, defaultValue: event, options: [{ label: Event, value: event }, { label: Cultural, value: cultural }, { label: Editorial, value: editorial }, { label: Promotional, value: promotional }], binding: { mode: variable, target: poster_type } }
- { id: visual-direction, label: Visual direction, type: enum, defaultValue: bold geometric, options: [{ label: Bold geometric, value: bold geometric }, { label: Refined editorial, value: refined editorial }, { label: Playful collage, value: playful collage }, { label: Cinematic, value: cinematic }], binding: { mode: variable, target: visual_direction } }
preservation:
- { id: exact-copy, label: Exact copy, description: "Preserve the supplied title exactly, including spelling, capitalization, and punctuation.", strength: must, appliesTo: [exact_title] }
outputs:
- { id: primary, label: Poster result, role: primary, kind: image, operations: [generate, edit, variation, upscale], layoutHint: hero }
blocks:
- { id: copy-input, type: controls, title: Your exact copy, sourceId: exact-title, x-connectTo: primary-output }
- { id: essentials, type: controls, title: Essential choices, content: { controlIds: [subject, poster-type, visual-direction] }, x-connectTo: primary-output }
- { id: prompt, type: prompt, title: More control, collapsedByDefault: true, x-connectTo: primary-output }
- { id: primary-output, type: output, title: Result, sourceId: primary }
x-discovery:
  collection: posters-content
  userPromise: Make a polished poster that keeps your supplied title exactly.
  intentAliases: [poster with exact tournament name, make an event poster, keep my headline exact, design a poster]
  intents: [create]
  inputModes: [text]
  subjectKinds: [event, campaign, place, product]
  outputKinds: [poster]
  preservationNeeds: [exact-text, spelling, capitalization, punctuation]
  complexity: quick
  requiredInputSummary: [An exact title, A short subject or event description]
  inputSummary: [An exact title, A short description]
  badges: [Keeps exact text, Makes 1 poster]
  thumbnail: { src: /recipe-thumbnails/poster-exact-text.webp, alt: A framed geometric concert poster displayed on a warm gallery wall }
  featuredRank: 7
x-presentation: { primaryControlIds: [exact-title, subject, visual-direction], initialView: canvas, resultEmphasis: hero, showPromptByDefault: false }
