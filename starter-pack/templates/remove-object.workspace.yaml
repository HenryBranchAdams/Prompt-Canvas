schema: prompt-canvas.prompt-workspace-template@2
id: remove-object
version: 1
title: Remove or clean up an object
description: Remove a distraction and rebuild the area naturally.
category: start-fast
tags: [remove person, erase object, clean up photo, remove distraction]
status: starter
compatibility: { minimumAppVersion: 0.1.0, templateFamily: reference-transformation }
thumbnail:
  assetPath: /recipe-thumbnails/remove-object.webp
  alt: A quiet wooden table before and after a distracting object is removed.
  accent: '#E9A23B'
capabilities: [image-to-image, image-edit, variations, upscale]
generation:
  provider: codex
  capability: image-generation
  delivery: webmcp-import
  operations: [edit, variation, upscale]
  defaultOperation: edit
  preferredMimeTypes: [image/png, image/webp]
prompt:
  title: Object removal
  body: >-
    Remove only {{remove_target}} from the supplied photo. Reconstruct the
    occluded geometry, material, texture, reflections, and shadows so the edit
    is seamless. Preserve the camera viewpoint, crop, remaining people and
    objects, lighting, colors, and every detail not named for removal.
  variables:
    - id: remove_target
      label: What should be removed?
      type: text
      required: true
      defaultValue: The small distracting object on the table
references:
  - id: source-photo
    label: Source photo
    role: source-photo
    required: true
    multiple: false
    acceptedMimeTypes: [image/jpeg, image/png, image/webp]
    preserve: [surrounding geometry, texture, lighting, framing, unmentioned details]
controls:
  - id: remove-target
    label: What should be removed?
    type: textarea
    required: true
    defaultValue: The small distracting object on the table
    binding: { mode: variable, target: remove_target }
  - id: cleanup-priority
    label: Cleanup priority
    type: chips
    defaultValue: all
    options:
      - { label: Geometry, value: geometry }
      - { label: Texture, value: texture }
      - { label: Shadows, value: shadows }
      - { label: All, value: all }
    binding: { mode: agent-context, target: edit.cleanupPriority }
preservation:
  - id: surroundings
    description: Preserve surrounding geometry, texture, lighting, framing, and all unmentioned content.
    strength: must
outputs:
  - { id: primary, label: Cleaned photo, role: primary, kind: image, count: 1, operations: [edit, upscale], layoutHint: hero }
  - { id: variations, label: Variations, role: variation, kind: image-set, count: 4, operations: [variation], layoutHint: strip }
blocks:
  - { id: source, type: references, title: '1. Your photo', x-connectTo: primary-output, x-geometry: { x: 80, y: 130, w: 380, h: 310 } }
  - { id: remove-target, type: controls, title: '2. What to remove', x-controlIds: [remove-target], x-connectTo: primary-output, x-geometry: { x: 510, y: 130, w: 360, h: 230 } }
  - { id: cleanup, type: controls, title: Cleanup, x-controlIds: [cleanup-priority], x-connectTo: primary-output, x-geometry: { x: 510, y: 400, w: 360, h: 180 } }
  - { id: primary-output, type: output, title: '3. Your result', sourceId: primary, x-connectTo: variation-strip, x-geometry: { x: 930, y: 120, w: 620, h: 600 } }
  - { id: variation-strip, type: variations, title: Variations, sourceId: variations, x-geometry: { x: 930, y: 760, w: 620, h: 210 } }
  - { id: full-prompt, type: prompt, title: 'More control · Preservation and prompt', x-connectTo: primary-output, x-geometry: { x: 80, y: 500, w: 790, h: 330 } }
layout: { mode: seeded, arrangement: reference-transform, preserveManualGeometry: true }
source: { kind: first-party, title: Remove or clean up an object, creator: Prompt Canvas, promptUsage: original }
x-discovery:
  collection: start-fast
  userPromise: Remove a distraction and rebuild the area naturally.
  intentAliases: [remove the person behind me, erase object, clean this up, remove distraction]
  intents: [edit, refine]
  inputModes: [single-image]
  subjectKinds: [person, product, object, place]
  outputKinds: [image-edit]
  preservationNeeds: [composition, camera-view, surrounding-geometry, texture, shadows]
  complexity: quick
  requiredInputSummary: [1 source photo, What to remove]
  inputSummary: [1 source photo, What to remove]
  badges: [Needs 1 photo, Keeps surroundings]
  thumbnail:
    src: /recipe-thumbnails/remove-object.webp
    alt: A distracting object removed from a tabletop while the surface texture and shadows remain natural
  featuredRank: 4
x-presentation: { primaryControlIds: [remove-target, cleanup-priority], initialView: canvas, resultEmphasis: hero, showPromptByDefault: false }
